<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F2E1E" />
      <stop offset="70%" stop-color="#081A11" />
      <stop offset="100%" stop-color="#030805" />
    </radialGradient>

    <!-- Loki Gold Metallic Gradient -->
    <linearGradient id="lokiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A8" />
      <stop offset="30%" stop-color="#F5C518" />
      <stop offset="70%" stop-color="#D4A017" />
      <stop offset="100%" stop-color="#8F6205" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C518" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#D4A017" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="runeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Emerald Shield Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="2.5" />

  <!-- Sacred Timeline Inner Rune Ring -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#10B981" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
  <circle cx="64" cy="64" r="51" fill="none" stroke="url(#lokiGold)" stroke-width="0.75" opacity="0.4" />

  <!-- Ambient Emerald Core Glow -->
  <circle cx="64" cy="68" r="28" fill="url(#emeraldGlow)" />

  <!-- Sacred Timeline Hour Markers -->
  <g stroke="#F5C518" stroke-width="1.5" opacity="0.7" stroke-linecap="round">
    <line x1="64" y1="13" x2="64" y2="17" />
    <line x1="64" y1="111" x2="64" y2="115" />
    <line x1="13" y1="64" x2="17" y2="64" />
    <line x1="111" y1="64" x2="115" y2="64" />
    <circle cx="28" cy="28" r="1.5" fill="#00FF87" />
    <circle cx="100" cy="28" r="1.5" fill="#00FF87" />
    <circle cx="28" cy="100" r="1.5" fill="#00FF87" />
    <circle cx="100" cy="100" r="1.5" fill="#00FF87" />
  </g>

  <!-- LOKI HORNS: Majestic Curved Crown -->
  <!-- Left Horn -->
  <path d="M 46 64 C 42 46, 22 36, 18 16 C 28 26, 42 36, 52 50 Z" 
        fill="url(#lokiGold)" 
        stroke="#8F6205" 
        stroke-width="0.7" 
        filter="url(#glow)" />
  <path d="M 44 60 C 40 46, 25 36, 21 21 C 29 29, 39 38, 48 48 Z" 
        fill="#FFE875" 
        opacity="0.6" />

  <!-- Right Horn -->
  <path d="M 82 64 C 86 46, 106 36, 110 16 C 100 26, 86 36, 76 50 Z" 
        fill="url(#lokiGold)" 
        stroke="#8F6205" 
        stroke-width="0.7" 
        filter="url(#glow)" />
  <path d="M 84 60 C 88 46, 103 36, 107 21 C 99 29, 89 38, 80 48 Z" 
        fill="#FFE875" 
        opacity="0.6" />

  <!-- Crown Base & Diadem -->
  <path d="M 44 62 L 64 74 L 84 62 L 78 54 L 64 61 L 50 54 Z" 
        fill="url(#lokiGold)" 
        stroke="#8F6205" 
        stroke-width="0.8" />
  <polygon points="64,54 69,63 64,71 59,63" fill="#00FF87" filter="url(#runeGlow)" />

  <!-- BARBER SHEARS INTERTWINED (Iconic Salon Symbolism) -->
  <!-- Blade Left to Right Downward -->
  <path d="M 42 38 L 86 86 M 86 86 L 90 90" stroke="url(#lokiGold)" stroke-width="3" stroke-linecap="round" />
  <circle cx="94" cy="94" r="6" fill="none" stroke="url(#lokiGold)" stroke-width="2.5" />
  
  <!-- Blade Right to Left Downward -->
  <path d="M 86 38 L 42 86 M 42 86 L 38 90" stroke="url(#lokiGold)" stroke-width="3" stroke-linecap="round" />
  <circle cx="34" cy="94" r="6" fill="none" stroke="url(#lokiGold)" stroke-width="2.5" />

  <!-- Shear Pivot Center Jewel -->
  <circle cx="64" cy="62" r="4.5" fill="#081A11" stroke="#F5C518" stroke-width="1.8" />
  <circle cx="64" cy="62" r="2.2" fill="#00FF87" filter="url(#glow)" />

  <!-- Floating Mystic Sparkles / Time Variant Embers -->
  <polygon points="64,22 66,27 71,27 67,30 68,35 64,32 60,35 61,30 57,27 62,27" fill="#F5C518" opacity="0.9" />
  <circle cx="38" cy="24" r="1.5" fill="#F5C518" />
  <circle cx="90" cy="24" r="1.5" fill="#F5C518" />
  <circle cx="64" cy="103" r="2" fill="#00FF87" opacity="0.8" />
</svg>
